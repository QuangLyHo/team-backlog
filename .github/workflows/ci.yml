name: CI

on:
    push:
        branches: [ main, deployment ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Get code
              uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '25'
                cache: maven

            - name: Run tests
              run: ./mvnw test
              env:
                JWT_SECRET: ${{ secrets.JWT_SECRET }}

    deploy:
        needs: test
        if: github.ref == 'refs/heads/deployment'
        runs-on: ubuntu-latest

        steps:
            - name: Trigger Render deploy
              run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
